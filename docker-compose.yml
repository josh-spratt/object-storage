# Local stand-ins for managed services:
#   postgres  -> RDS / Cloud SQL / any managed Postgres
#   seaweedfs -> S3 / GCS / R2 (speaks the S3 API, so the app code is identical)
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: media
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      # Runs once, on first start with an empty volume.
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d media"]
      interval: 2s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    command: >
      server -dir=/data -ip.bind=0.0.0.0
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333" # S3 API
    volumes:
      - s3data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  pgdata:
  s3data:
